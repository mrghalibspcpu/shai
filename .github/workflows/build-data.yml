name: Build SHIA AI data index

# Crawls the real sources (thaqalayn.com + sistani.org) and commits the
# generated index back to the branch, so the offline on-device search engine
# has genuinely authentic data to retrieve from.
#
# The commit message carries "[skip ci]" so committing the data does not
# re-trigger this (or any other) workflow — otherwise it would loop forever.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  data:
    name: Crawl & commit data index
    if: github.event_name != 'pull_request' || !contains(github.event.head_commit.message, 'chore(data)')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Thaqalayn hadith index
        env:
          HADITH_PER_COLLECTION: '40'
          HADITH_CONCURRENCY: '8'
        run: node scripts/build-hadith-index.mjs --sample 2

      - name: Build fatawa index
        env:
          FATAWA_MAX_CHAPTERS: '60'
          FATAWA_CONCURRENCY: '6'
        run: node scripts/build-fatawa-index.mjs --sample 2

      - name: Report index stats
        run: |
          node -e '
            const fs=require("fs");
            for (const p of ["public/data/thaqalayn/hadith.json","public/data/fatawa/fatawa.json"]) {
              if (!fs.existsSync(p)) { console.log(p,"MISSING"); continue; }
              const j=JSON.parse(fs.readFileSync(p,"utf8"));
              console.log(p, "records:", j.count, "bytes:", fs.statSync(p).size);
            }
          '

      - name: Commit data if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A public/data
          if git diff --cached --quiet; then
            echo "::notice::data index unchanged — nothing to commit"
          else
            git commit -m "chore(data): refresh Thaqalayn + fatawa index [skip ci]"
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
            echo "::notice::data index committed"
          fi
