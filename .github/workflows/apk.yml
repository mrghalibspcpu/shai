name: Build SHAI Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Self-test (jsdom)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm install --no-save --no-audit --no-fund jsdom
      - run: npm run test

  build:
    name: Build APK
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install JS dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Copy web assets into the Android project
        run: npx cap sync android

      - name: Grant gradlew permission
        run: chmod +x android/gradlew

      - name: Assemble debug APK
        run: ./android/gradlew -p android assembleDebug --no-daemon --console=plain

      - name: Assemble release (unsigned) APK
        run: ./android/gradlew -p android assembleRelease --no-daemon --console=plain

      - name: Collect APKs
        id: collect
        run: |
          mkdir -p build
          cp "$(find android/app/build/outputs/apk/debug -name '*.apk' | head -1)"  build/SHAI-debug.apk
          cp "$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)" build/SHAI-release-unsigned.apk
          ls -lh build

      - uses: actions/upload-artifact@v4
        with:
          name: SHAI-APK
          path: |
            build/SHAI-debug.apk
            build/SHAI-release-unsigned.apk
          retention-days: 30

      # Attaches the APKs to a release when you push a tag like v1.0.0
      - name: Attach APKs to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/SHAI-debug.apk
            build/SHAI-release-unsigned.apk
