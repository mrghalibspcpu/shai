name: Build SHAI Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Self-test (jsdom + offline corpus)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci

      # The corpus is committed to the repo (built offline from the CC0
      # ThaqalaynData dump) — assert it is really there before packaging it.
      - name: Verify offline hadith corpus
        run: |
          node -e '
            const fs=require("fs");
            const m=JSON.parse(fs.readFileSync("public/data/corpus/manifest.json","utf8"));
            const shards=Object.keys(m.shards||{}).length;
            console.log(`corpus: ${m.count} records (${m.hadith} hadith + ${m.quran} ayah) in ${m.books.length} books, ${shards} shards`);
            console.log(`urdu=${m.translations.ur} english=${m.translations.en} deep-links=${m.linked}`);
            if (m.hadith < 40000) throw new Error("corpus looks truncated: "+m.hadith);
            if (!fs.existsSync("public/data/corpus/"+m.index)) throw new Error("missing "+m.index);
            for (const s of Object.values(m.shards)) {
              if (!fs.existsSync("public/data/corpus/"+s.file)) throw new Error("missing shard "+s.file);
            }
            console.log("corpus OK");'

      - run: npm test

  build:
    name: Build APK
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write   # needed to attach APKs to a release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # Capacitor 7 / AGP 8.7 compile with source+target compatibility 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Android SDK environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      - name: Install JS dependencies
        run: npm ci

      - name: Build web bundle (includes public/data/corpus)
        run: npm run build

      - name: Check the corpus made it into the bundle
        run: |
          ls dist/data/corpus/books | wc -l
          du -sh dist dist/data/corpus
          test -f dist/data/corpus/manifest.json
          test -f "dist/data/corpus/$(node -p "require('./public/data/corpus/manifest.json').index")"

      - name: Copy web assets into the Android project
        run: npx cap sync android

      - name: Grant gradlew permission
        run: chmod +x android/gradlew

      # The signing key is committed, so every build is signed identically and
      # updates install cleanly over the previous one.
      - name: Ensure signing keystore
        id: keystore
        run: |
          mkdir -p android/keystore
          echo "minted=false" >> "$GITHUB_OUTPUT"
          if [ ! -f android/keystore/shai-release.jks ]; then
            echo "::notice::Minting a fresh signing keystore"
            echo "minted=true" >> "$GITHUB_OUTPUT"
            keytool -genkeypair -v \
              -keystore android/keystore/shai-release.jks \
              -storepass 'shai-android-2026' \
              -keypass   'shai-android-2026' \
              -alias shai \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -dname "CN=SHAI, OU=SHAI Mobile, O=SHAI, L=Islamabad, ST=Islamabad, C=PK"
          else
            echo "::notice::Using committed keystore"
          fi
          keytool -list -keystore android/keystore/shai-release.jks \
            -storepass 'shai-android-2026'

      - name: Assemble APKs
        id: gradle
        run: |
          set +e
          ./android/gradlew -p android assembleDebug assembleRelease \
            --no-daemon --console=plain > gradle.log 2>&1
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # CI log archives are not always reachable, so mirror the tail of the
          # Gradle output into job annotations + the step summary.
          if [ "$code" != "0" ]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 250 gradle.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 60 gradle.log | while IFS= read -r line; do
              echo "::error title=gradle::$line"
            done
          fi
          exit $code

      - name: Collect APKs
        run: |
          mkdir -p build
          cp "$(find android/app/build/outputs/apk/debug   -name '*.apk' | head -1)" build/SHAI-debug.apk
          cp "$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)" build/SHAI-release.apk
          ls -lh build
          "${ANDROID_HOME}/build-tools/"*/apksigner verify --print-certs build/SHAI-release.apk | head -20

      - uses: actions/upload-artifact@v4
        with:
          name: SHAI-APK
          path: |
            build/SHAI-debug.apk
            build/SHAI-release.apk
          retention-days: 90

      - name: Upload keystore (first run only)
        if: steps.keystore.outputs.minted == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SHAI-keystore
          path: android/keystore/shai-release.jks
          retention-days: 90

      # Pushing a tag like v1.2.0 publishes a permanent, login-free download.
      - name: Attach APKs to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/SHAI-debug.apk
            build/SHAI-release.apk
