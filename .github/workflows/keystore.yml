name: Generate signing keystore (one-off)

# Signed APKs must all share ONE key, otherwise Android refuses to install an
# update over the previous build ("App not installed"). This job mints that key
# exactly once. Download the artifact, commit it to android/keystore/, and every
# future build — local or CI — will be signed identically.
#
#   gh workflow run "Generate signing keystore" --ref <branch>

on:
  workflow_dispatch:

jobs:
  keystore:
    name: Mint SHAI release keystore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create keystore
        run: |
          keytool -genkeypair -v \
            -keystore shai-release.jks \
            -storepass 'shai-android-2026' \
            -keypass 'shai-android-2026' \
            -alias shai \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -dname "CN=SHAI, OU=SHAI Mobile, O=SHAI, L=Islamabad, ST=Islamabad, C=PK"

      - name: Verify
        run: |
          keytool -list -v \
            -keystore shai-release.jks \
            -storepass 'shai-android-2026' | head -20
          ls -l shai-release.jks

      - name: Print key details
        run: |
          echo "alias     : shai"                      >> "$GITHUB_STEP_SUMMARY"
          echo "password  : shai-android-2026"         >> "$GITHUB_STEP_SUMMARY"
          echo "file      : android/keystore/shai-release.jks" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: SHAI-keystore
          path: shai-release.jks
          retention-days: 90
